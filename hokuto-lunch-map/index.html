<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>北杜市ランチマップ</title>
    <link rel="stylesheet" href="assets/map.css" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f3ec;
        --surface: #fffdf8;
        --surface-2: #efe9db;
        --ink: #2b2421;
        --ink-soft: #6d6357;
        --line: #ddd3c0;
        --accent: #a33e1f;
        --accent-ink: #fff8f1;
        --accent-soft: #f3ddd2;
        --pin: #a33e1f;
        --pin-on: #1f5fa3;
        --shadow: 0 1px 2px rgba(60, 42, 20, .08), 0 6px 18px rgba(60, 42, 20, .07);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17140f;
          --surface: #221e17;
          --surface-2: #2c2619;
          --ink: #f0e9dc;
          --ink-soft: #b3a892;
          --line: #423a2c;
          --accent: #e0784a;
          --accent-ink: #241109;
          --accent-soft: #46281a;
          --pin: #e0784a;
          --pin-on: #6db3f2;
          --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
        line-height: 1.55;
      }
      .wrap { max-width: 1060px; margin: 0 auto; padding: 0 16px 40px; }

      header.page-head { padding: 22px 2px 6px; }
      header.page-head h1 {
        margin: 0;
        font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
        font-size: clamp(26px, 5.4vw, 38px);
        font-weight: 700;
        letter-spacing: .02em;
      }
      header.page-head p { margin: 6px 0 0; color: var(--ink-soft); font-size: 14px; }

      /* ---- Day selector ---- */
      .daybar {
        position: sticky; top: 0; z-index: 30;
        margin: 14px -16px 0; padding: 8px 16px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      .daybar .days {
        display: flex; gap: 6px;
        max-width: 1060px; margin: 0 auto;
        overflow-x: auto; scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .daybar .days::-webkit-scrollbar { display: none; }
      .day-btn {
        appearance: none; border: 1.5px solid var(--line);
        background: var(--surface); color: var(--ink);
        border-radius: 10px; height: 40px; padding: 6px 12px;
        font: inherit; font-size: 15px; font-weight: 700;
        cursor: pointer; display: inline-flex; flex-direction: row; align-items: center; justify-content: center; gap: 6px;
        flex: 0 0 auto; white-space: nowrap;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      .day-btn > span { white-space: nowrap; }
      .day-btn .cnt { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); line-height: 1; }
      .day-btn .today-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
      .day-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .day-btn[aria-pressed="true"] .cnt { color: var(--accent-ink); opacity: .85; }
      .day-btn[aria-pressed="true"] .today-dot { background: var(--accent-ink); }
      .day-btn:focus-visible { outline: 3px solid var(--pin-on); outline-offset: 2px; }
      .day-btn.sat { color: #1f5fa3; }
      .day-btn.sun { color: #b3352c; }
      .day-btn[aria-pressed="true"].sat, .day-btn[aria-pressed="true"].sun { color: var(--accent-ink); }
      @media (prefers-color-scheme: dark) {
        .day-btn.sat { color: #7db8ef; }
        .day-btn.sun { color: #f0938a; }
        .day-btn[aria-pressed="true"].sat, .day-btn[aria-pressed="true"].sun { color: var(--accent-ink); }
      }

      .result-line { margin: 16px 2px 10px; font-size: 15px; color: var(--ink-soft); }
      .result-line strong { color: var(--ink); font-size: 17px; }

      /* ---- Layout ---- */
      .layout { display: grid; grid-template-columns: 1fr; gap: 18px; align-items: start; }
      .map-col { order: -1; }
      @media (min-width: 880px) {
        .layout { grid-template-columns: minmax(0, 1fr) 400px; }
        .map-col { order: 0; position: sticky; top: 70px; }
      }
      #map { height: 340px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
      @media (min-width: 880px) { #map { height: 480px; } }
      .map-note { margin: 8px 2px 0; font-size: 12.5px; color: var(--ink-soft); }
      .map-fallback {
        border: 1px solid var(--line); border-radius: 14px; padding: 10px;
        background: var(--surface);
      }
      .map-fallback img { display: block; width: 100%; height: auto; border-radius: 8px; }
      .map-fallback p { margin: 8px 2px 2px; color: var(--ink-soft); font-size: 13.5px; }
      .map-attribution { margin: 6px 2px 0; font-size: 12px; }
      .map-attribution a { color: var(--ink-soft); }

      /* ---- Pins (map markers) ---- */
      .pin {
        width: 28px; height: 28px; border-radius: 50% 50% 50% 4px;
        transform: rotate(-45deg);
        background: var(--pin); color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: 700;
        border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35);
        cursor: pointer;
      }
      .pin > span { transform: rotate(45deg); line-height: 1; }
      .pin--on { background: var(--pin-on); width: 34px; height: 34px; font-size: 15px; z-index: 5; }
      .pin--closed { background: #8a8378; }

      /* ---- Cards ---- */
      .cards { display: grid; gap: 12px; }
      .card {
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
        padding: 14px 16px; box-shadow: var(--shadow);
        scroll-margin-top: 70px;
      }
      .card.map-selected { border-color: var(--pin-on); box-shadow: 0 0 0 2px var(--pin-on), var(--shadow); }
      .card .top { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
      .num {
        flex: 0 0 auto; width: 26px; height: 26px; margin-top: 2px;
        border-radius: 50%; background: var(--pin); color: #fff;
        font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;
      }
      .card.map-selected .num { background: var(--pin-on); }
      .card h3 { margin: 0; font-size: 18px; line-height: 1.35; flex: 1 1 150px; min-width: 0; overflow-wrap: break-word; }

      /* ---- Temporary-closure status (loaded from the external data page) ---- */
      .today-status {
        margin: 14px 0 0; padding: 14px 16px;
        background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
        box-shadow: var(--shadow);
      }
      .today-status h2 {
        margin: 0; font-size: 16px; font-weight: 700;
        display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
      }
      .today-status h2 .checked { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
      .today-status .stale { margin: 6px 0 0; font-size: 13px; font-weight: 700; color: var(--accent); }
      .today-status .loading { margin: 10px 0 0; font-size: 14.5px; color: var(--ink-soft); }
      .today-status .load-error { margin: 10px 0 0; font-size: 14.5px; font-weight: 700; color: var(--accent); }
      .today-status .none { margin: 10px 0 0; font-size: 14.5px; }
      .today-status .api-note { margin: 10px 0 0; font-size: 13.5px; color: var(--ink-soft); }
      .today-status .today-source { margin: 12px 0 0; font-size: 12.5px; color: var(--ink-soft); }
      .closed-list { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
      .closed-list li { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: 14.5px; }
      .closed-list li .tname { font-weight: 700; }
      .closed-list li .treason { color: var(--ink-soft); font-size: 13.5px; }
      .status-tag {
        display: inline-block; font-size: 11.5px; font-weight: 700;
        padding: 3px 9px; border-radius: 999px; white-space: nowrap;
        background: var(--accent-soft); color: var(--accent);
      }

      .meta { margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
      .meta .town { font-weight: 700; }
      .meta .genre { color: var(--ink-soft); }
      .meta .hours { color: var(--ink); }
      .note { margin: 6px 0 0; font-size: 13.5px; color: var(--ink-soft); }
      /* ---- Genre chips & sort ---- */
      .controls {
        margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 10px 14px;
        align-items: center; justify-content: space-between;
      }
      .genre-chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip {
        appearance: none; border: 1.5px solid var(--line);
        background: var(--surface); color: var(--ink);
        border-radius: 999px; padding: 7px 13px; min-height: 38px;
        font: inherit; font-size: 14px; font-weight: 700;
        cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      .chip .chip-cnt { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }
      .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .chip[aria-pressed="true"] .chip-cnt { color: var(--accent-ink); opacity: .85; }
      .chip:focus-visible { outline: 3px solid var(--pin-on); outline-offset: 2px; }
      .sort-wrap { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
      .sort-wrap select {
        font: inherit; font-size: 14px; font-weight: 600;
        color: var(--ink); background: var(--surface);
        border: 1.5px solid var(--line); border-radius: 10px;
        padding: 8px 10px; min-height: 40px; cursor: pointer;
      }
      .sort-wrap select:focus-visible { outline: 3px solid var(--pin-on); outline-offset: 2px; }

      /* ---- Card badges & closed state ---- */
      .badges { margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
      .badge {
        display: inline-block; font-size: 12px; font-weight: 700;
        padding: 3px 10px; border-radius: 999px; white-space: nowrap;
      }
      .badge--temp { background: var(--accent-soft); color: var(--accent); }
      .badge--cal { background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--line); }
      .badge--open { background: #e0f1e3; color: #17663a; }
      @media (prefers-color-scheme: dark) {
        .badge--open { background: #1d3325; color: #7fd6a4; }
      }
      .card--closed { filter: grayscale(.75); opacity: .6; }
      .cal-note { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-soft); }

      /* ---- Card link buttons ---- */
      .links { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
      .links a {
        display: inline-flex; align-items: center; gap: 6px;
        font-weight: 700; font-size: 14px; text-decoration: none;
        border-radius: 999px; padding: 7px 15px; min-height: 40px;
      }
      .links a svg { width: 15px; height: 15px; flex: 0 0 auto; }
      .route-btn { background: var(--accent); border: 1px solid var(--accent); color: var(--accent-ink); }
      .route-btn:active { opacity: .85; }
      .ig-btn { color: var(--accent); border: 1px solid var(--accent); }
      .ig-btn:active { background: var(--accent-soft); }

      /* ---- Map popup (shown when a pin is selected) ---- */
      .map-wrap { position: relative; }
      .map-popup {
        position: absolute; z-index: 10; width: 232px; max-width: calc(100% - 12px);
        background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
        box-shadow: var(--shadow); padding: 12px 14px;
      }
      .map-popup .mp-name { margin: 0 26px 0 0; font-size: 15.5px; font-weight: 700; line-height: 1.35; }
      .map-popup .mp-meta { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-soft); }
      .map-popup .route-btn {
        display: inline-flex; align-items: center; gap: 6px;
        margin-top: 9px; padding: 6px 14px; min-height: 36px;
        font-weight: 700; font-size: 13.5px; text-decoration: none; border-radius: 999px;
      }
      .map-popup .route-btn svg { width: 14px; height: 14px; }
      .map-popup-close {
        position: absolute; top: 4px; right: 4px;
        appearance: none; border: none; background: transparent; color: var(--ink-soft);
        font: inherit; font-size: 18px; line-height: 1; width: 32px; height: 32px;
        cursor: pointer; border-radius: 8px;
      }
      .map-popup .mp-hours { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-soft); }

      /* ---- Mobile list/map tabs (single-column widths only) ---- */
      .view-tabs { display: none; }
      @media (max-width: 879px) {
        .view-tabs {
          display: flex; gap: 6px; margin: 2px 0 12px;
          background: var(--surface-2); border: 1px solid var(--line);
          border-radius: 999px; padding: 4px;
        }
        .view-tab {
          appearance: none; border: none; background: transparent; color: var(--ink-soft);
          border-radius: 999px; padding: 8px 0; min-height: 40px; flex: 1 1 0;
          font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
          touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .view-tab[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
        .view-tab:focus-visible { outline: 3px solid var(--pin-on); outline-offset: 2px; }
        .layout[data-mview="list"] .map-col { display: none; }
        .layout[data-mview="map"] .list-col { display: none; }
        .layout[data-mview="map"] #map { height: 62vh; height: 62dvh; min-height: 380px; }
        .layout[data-mview="map"] .map-popup {
          left: 8px; right: 8px; bottom: 8px; top: auto;
          width: auto; max-width: none;
        }
      }

      .section-title {
        margin: 28px 2px 12px; font-size: 18px; font-weight: 700;
        display: flex; align-items: baseline; gap: 8px;
      }
      .section-title .sub { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
      .empty { color: var(--ink-soft); font-size: 14px; padding: 8px 2px; }

      footer.caution {
        margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--line);
        font-size: 13px; color: var(--ink-soft);
      }
      @media (prefers-reduced-motion: no-preference) {
        .card { transition: border-color .15s ease, box-shadow .15s ease; }
        .day-btn, .chip { transition: background .12s ease, color .12s ease; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="page-head">
        <h1>北杜市ランチマップ</h1>
        <p>北杜市のランチのお店、全<span id="total-count"></span>店。曜日で絞り込めます。</p>
      </header>

      <section class="today-status" id="today-status" aria-label="臨時休業情報">
        <h2>臨時休業情報</h2>
        <p class="loading" id="today-loading">読み込み中…</p>
        <div id="today-body"></div>
      </section>

      <div class="daybar" role="group" aria-label="曜日で絞り込み">
        <div class="days" id="days"></div>
      </div>

      <div class="controls">
        <div class="genre-chips" id="genre-chips" role="group" aria-label="ジャンルで絞り込み"></div>
        <label class="sort-wrap">並び順
          <select id="sort-sel">
            <option value="recommended">おすすめ順</option>
            <option value="open">営業中を先に</option>
            <option value="near">近い順</option>
          </select>
        </label>
      </div>

      <p class="result-line" id="result-line" aria-live="polite"></p>

      <div class="view-tabs" role="group" aria-label="一覧と地図の切り替え">
        <button type="button" class="view-tab" data-view="list" aria-pressed="true">一覧</button>
        <button type="button" class="view-tab" data-view="map" aria-pressed="false">地図</button>
      </div>

      <div class="layout" id="layout" data-mview="list">
        <div class="list-col">
          <div class="cards" id="cards"></div>
          <p class="empty" id="empty" hidden>この曜日にランチ営業のお店は見つかりませんでした。</p>

          <h2 class="section-title" id="unknown-title">曜日は要確認 <span class="sub" id="unknown-count"></span></h2>
          <div class="cards" id="unknown-cards"></div>
        </div>
        <div class="map-col">
          <div class="map-wrap">
            <div id="map" aria-label="お店の地図"></div>
            <div class="map-popup" id="map-popup" hidden>
              <button type="button" class="map-popup-close" id="map-popup-close" aria-label="ポップアップを閉じる">×</button>
              <p class="mp-name" id="map-popup-name"></p>
              <p class="mp-meta" id="map-popup-meta"></p>
              <p class="mp-hours" id="map-popup-hours"></p>
              <a class="route-btn" id="map-popup-route" href="#" target="_blank" rel="noopener"></a>
            </div>
          </div>

            if (key === "today") sel = { kind: "today", dow: todayNum };
            else if (key === "tomorrow") sel = { kind: "tomorrow", dow: todayNum };
            else if (key === "all") sel = { kind: "all", dow: todayNum };
            else sel = { kind: "dow", dow: parseInt(key.slice(1), 10) };
            render();
          });
        });
      }

      function buildGenreChips() {
        var defs = [{ key: "all", label: "全て" }].concat(GENRE_GROUPS.map(function (g) {
          return { key: g, label: g };
        }));
        chipsEl.innerHTML = defs.map(function (def) {
          var cnt = def.key === "all" ? SHOPS.length
            : SHOPS.filter(function (s) { return s.genre_group === def.key; }).length;
          return '<button type="button" class="chip" data-genre="' + esc(def.key) + '" aria-pressed="false">'
            + esc(def.label) + '<span class="chip-cnt">' + cnt + '</span></button>';
        }).join("");
        chipsEl.querySelectorAll(".chip").forEach(function (chip) {
          chip.addEventListener("click", function () {
            genreSel = chip.getAttribute("data-genre");
            render();
          });
        });
      }

      sortSelEl.addEventListener("change", function () {
        sortSel = sortSelEl.value;
        if (sortSel === "near" && !userPos && !geoRequested) {
          geoRequested = true;
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function (pos) {
              userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
              if (sortSel === "near") render();
            }, function () { /* 取得できない場合は従来の並びのまま */ },
            { timeout: 8000, maximumAge: 600000 });
          }
        }
        render();
      });

      // 営業状態の判定: 'open' | 'temp'（本日臨時休業） | 'cal'（カレンダーで休業） | 'unknown'（曜日不明） | 'off'
      function stateOf(shop, t, tempSet) {
        if (t.mode === "date") {
          if (tempSet[shop.id]) return "temp";
          if (shop.closed_dates && shop.closed_dates.indexOf(t.iso) !== -1) return "cal";
          if (shop.open_dates && shop.open_dates.indexOf(t.iso) !== -1) return "open";
          if (!shop.days) return "unknown";
          return shop.days.indexOf(dowNum(t.date)) !== -1 ? "open" : "off";
        }
        if (t.mode === "dow") {
          if (!shop.days) return "unknown";
          return shop.days.indexOf(t.dow) !== -1 ? "open" : "off";
        }
        return shop.days ? "open" : "unknown";
      }

      function cardHTML(shop, pinIndex, st, t) {
        var closedCard = st === "temp" || st === "cal";
        var html = '<article class="card' + (closedCard ? ' card--closed' : '') + '" data-id="' + esc(shop.id) + '" data-name="' + esc(shop.name) + '">';
        html += '<div class="top">';
        if (pinIndex != null) html += '<span class="num" aria-hidden="true">' + (pinIndex + 1) + '</span>';
        html += '<h3>' + esc(shop.name) + '</h3>';
        html += '</div>';
        var badges = "";
        if (st === "temp") badges += '<span class="badge badge--temp">本日臨時休業</span>';
        if (st === "cal") badges += '<span class="badge badge--cal">カレンダーで休業</span>';
        if (!closedCard && openNowActive(t) && openNow(shop)) badges += '<span class="badge badge--open">営業中</span>';
        if (badges) html += '<p class="badges">' + badges + '</p>';
        html += '<p class="meta"><span class="town">' + esc(shop.town) + '</span>'
          + '<span class="genre">' + esc(shop.genre) + '</span>'
          + (shop.hours ? '<span class="hours">' + esc(shop.hours) + '</span>' : '')
          + '</p>';
        if (shop.note) html += '<p class="note">' + esc(shop.note) + '</p>';
        if (t.mode === "date" && shop.has_calendar && shop.calendar_month !== monthOf(t.date)) {
          html += '<p class="cal-note">今月のカレンダー未取得</p>';
        }
        html += '<p class="links">'
          + '<a class="route-btn" href="' + directionsUrl(shop) + '" target="_blank" rel="noopener">' + ROUTE_LABEL + '</a>';
        if (shop.ig) {
          html += '<a class="ig-btn" href="https://www.instagram.com/' + encodeURIComponent(shop.ig) + '" target="_blank" rel="noopener">'
            + IG_SVG + '<span>@' + esc(shop.ig) + '</span></a>';
        }
        html += '</p>';
        html += '</article>';
        return html;
      }

      var mapHandle = null;
      var mapFailed = false;
      var currentRows = [];
      var currentPinShops = [];
      var mobileView = "list";
      var selectedId = null;
      var mapMountedHidden = false;
      var darkMq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : { matches: false };
      function isNarrow() {
        return !!(window.matchMedia && window.matchMedia("(max-width: 879px)").matches);
      }
      function mapVisible() { return !isNarrow() || mobileView === "map"; }

      function onMapUnavailable() {
        mapFailed = true;
        mapEl.hidden = true;
        mapFallbackEl.hidden = false;
        mapNoteEl.textContent = "";
        hidePopup();
      }

      function highlightRow(index, scroll) {
        currentRows.forEach(function (row, i) {
          if (row) row.classList.toggle("map-selected", i === index);
        });
        if (scroll && index != null && currentRows[index]) {
          currentRows[index].scrollIntoView({ block: "start" });
        }
      }

      function hidePopup() { if (popupEl) popupEl.hidden = true; }

      function showPopup(shop) {
        if (!shop || !popupEl) return;
        popupNameEl.textContent = shop.name;
        popupMetaEl.textContent = shop.town + "・" + shop.genre;
        popupHoursEl.textContent = shop.hours || "";
        popupHoursEl.hidden = !shop.hours;
        popupRouteEl.setAttribute("href", directionsUrl(shop));
        popupRouteEl.innerHTML = ROUTE_LABEL;
        popupEl.hidden = false;
        requestAnimationFrame(positionPopup);
      }

      function positionPopup() {
        if (popupEl.hidden || !mapWrapEl) return;
        if (isNarrow()) {
          // スマホの地図表示ではCSSで地図下部のミニカードとして固定する
          popupEl.style.left = "";
          popupEl.style.top = "";
          return;
        }
        var wrapRect = mapWrapEl.getBoundingClientRect();
        var pw = popupEl.offsetWidth, ph = popupEl.offsetHeight;
        var marker = mapEl.querySelector(".pin--on");
        var left, top;
        if (marker) {
          var mr = marker.getBoundingClientRect();
          var cx = mr.left - wrapRect.left + mr.width / 2;
          left = Math.min(Math.max(cx - pw / 2, 6), Math.max(wrapRect.width - pw - 6, 6));
          top = mr.top - wrapRect.top - ph - 14;
          if (top < 6) top = mr.bottom - wrapRect.top + 10;
        } else {
          left = Math.max((wrapRect.width - pw) / 2, 6);
          top = 8;
        }
        popupEl.style.left = left + "px";
        popupEl.style.top = top + "px";
      }

      function onPinSelect(index) {
        if (index == null || !currentPinShops[index]) {
          selectedId = null;
          highlightRow(null, false);
          hidePopup();
          return;
        }
        selectedId = currentPinShops[index].id;
        // スマホの地図表示では一覧へスクロールせず、地図下部のミニカードで見せる
        highlightRow(index, !isNarrow());
        showPopup(currentPinShops[index]);
      }

      function restoreSelection() {
        if (!selectedId) return;
        var idx = -1;
        currentPinShops.forEach(function (s, i) { if (s.id === selectedId) idx = i; });
        if (idx === -1) { selectedId = null; return; }
        if (mapHandle && typeof mapHandle.selectPlace === "function") mapHandle.selectPlace(idx);
        highlightRow(idx, false);
        showPopup(currentPinShops[idx]);
      }

      function render() {
        hidePopup();
        daysEl.querySelectorAll(".day-btn").forEach(function (btn) {
          btn.setAttribute("aria-pressed", String(btn.getAttribute("data-key") === selKey()));
        });
        chipsEl.querySelectorAll(".chip").forEach(function (chip) {
          chip.setAttribute("aria-pressed", String(chip.getAttribute("data-genre") === genreSel));
        });

        var t = targetInfo();
        // 臨時休業の反映は「今日」表示で、レコードの日付が今日のときだけ
        var tempSet = (sel.kind === "today" && statusRecord && statusRecord.date === todayISO) ? tempClosedIds : {};

        var main = [], tail = [], unknown = [];
        SHOPS.forEach(function (shop, idx) {
          var e = { shop: shop, idx: idx, st: stateOf(shop, t, tempSet) };
          if (genreSel !== "all" && shop.genre_group !== genreSel) return;
          if (e.st === "open") main.push(e);
          else if (e.st === "temp" || e.st === "cal") tail.push(e);
          else if (e.st === "unknown") unknown.push(e);
        });

        // 並び順（休業の店は常に末尾の tail に残る）
        if (sortSel === "open" && openNowActive(t)) {
          main.sort(function (a, b) {
            return ((openNow(b.shop) ? 1 : 0) - (openNow(a.shop) ? 1 : 0)) || (a.idx - b.idx);
          });
        } else if (sortSel === "near" && userPos) {
          main.forEach(function (e) { e.dist = distKm(userPos, e.shop); });
          main.sort(function (a, b) { return (a.dist - b.dist) || (a.idx - b.idx); });
        }
        var shownMain = main.concat(tail);

        // ピンは表示中の一覧に対応させる。「全て」表示では曜日不明の店も加える
        var pinEntries = shownMain.slice();
        if (t.mode === "all") pinEntries = pinEntries.concat(unknown);
        var pinIndexOf = {};
        pinEntries.forEach(function (e, i) { pinIndexOf[e.shop.id] = i; });
        function pinOf(e) { return (e.shop.id in pinIndexOf) ? pinIndexOf[e.shop.id] : null; }

        // 件数表示（休業の店は営業件数に数えず、内訳を添える）
        var tempCount = tail.filter(function (e) { return e.st === "temp"; }).length;
        var calCount = tail.filter(function (e) { return e.st === "cal"; }).length;
        var dayPart;
        if (t.mode === "date") {
          dayPart = '<strong>' + t.label + '（' + (t.date.getMonth() + 1) + '月' + t.date.getDate() + '日・'
            + DAY_LABELS[dowNum(t.date) - 1] + '）</strong>にランチ営業のお店 ' + main.length + '店';
          if (tempCount) dayPart += '（うち臨時休業' + tempCount + '店）';
          if (calCount) dayPart += '（カレンダー休業' + calCount + '店）';
        } else if (t.mode === "dow") {
          dayPart = '<strong>' + DAY_LABELS[t.dow - 1] + '曜日</strong>にランチ営業のお店 ' + main.length + '店';
        } else {
          dayPart = '<strong>全ての曜日</strong> — ' + main.length + '店 ＋ 曜日は要確認 ' + unknown.length + '店（全' + SHOPS.length + '店）';
        }
        resultLineEl.innerHTML = (genreSel !== "all" ? '<strong>' + esc(genreSel) + '</strong>：' : '') + dayPart;

        cardsEl.innerHTML = shownMain.map(function (e) {
          return cardHTML(e.shop, pinOf(e), e.st, t);
        }).join("");
        emptyEl.hidden = shownMain.length > 0;

        unknownTitleEl.style.display = unknown.length ? "" : "none";
        unknownCountEl.textContent = unknown.length ? "（" + unknown.length + "店）" : "";
        unknownCardsEl.innerHTML = unknown.map(function (e) {
          return cardHTML(e.shop, pinOf(e), "unknown", t);
        }).join("");

        // Map
        if (mapHandle && typeof mapHandle.destroy === "function") {
          try { mapHandle.destroy(); } catch (err) { /* ignore */ }
          mapHandle = null;
        }
        currentRows = [];
        currentPinShops = [];
        if (!mapFailed && window.MapHelpers && pinEntries.length) {
          var places = pinEntries.map(function (e) {
            return {
              label: e.shop.name, venue: e.shop.name, locality: "北杜市 " + e.shop.town,
              lat: e.shop.lat, lng: e.shop.lng,
              closed: e.st === "temp" || e.st === "cal"
            };
          });
          var cardById = {};
          cardsEl.querySelectorAll(".card").forEach(function (c) { cardById[c.getAttribute("data-id")] = c; });
          unknownCardsEl.querySelectorAll(".card").forEach(function (c) { cardById[c.getAttribute("data-id")] = c; });
          currentRows = pinEntries.map(function (e) { return cardById[e.shop.id] || null; });
          currentPinShops = pinEntries.map(function (e) { return e.shop; });
          mapHandle = MapHelpers.mountMap(mapEl, {
            places: places,
            baseStyle: darkMq.matches ? "dark" : "light",
            marker: function (place, index, selected) {
              return '<div class="pin' + (selected ? ' pin--on' : '') + (place.closed ? ' pin--closed' : '')
                + '"><span>' + (index + 1) + '</span></div>';
            },
            onSelectPlace: function (index) { onPinSelect(index); }
          }, onMapUnavailable);
          mapMountedHidden = mapEl.clientWidth === 0;
          currentRows.forEach(function (row, i) {
            if (!row) return;
            row.addEventListener("click", function () {
              selectedId = currentPinShops[i].id;
              if (mapHandle && typeof mapHandle.selectPlace === "function") mapHandle.selectPlace(i);
              highlightRow(i, false);
              if (mapVisible()) showPopup(currentPinShops[i]);
            });
          });
          if (selectedId && mapVisible()) restoreSelection();
          var noCoord = pinEntries.filter(function (e) {
            return typeof e.shop.lat !== "number" || typeof e.shop.lng !== "number";
          }).length;
          mapNoteEl.textContent = noCoord
            ? "地図のピンは座標が確認できた " + (pinEntries.length - noCoord) + " 店のみ表示しています"
            : "";
        } else if (!mapFailed) {
          mapNoteEl.textContent = "";
        }
      }

      // ---- スマホ幅の一覧／地図タブ ----
      var viewTabs = document.querySelectorAll(".view-tab");
      function setMobileView(view) {
        mobileView = view;
        layoutEl.setAttribute("data-mview", view);
        viewTabs.forEach(function (tab) {
          tab.setAttribute("aria-pressed", String(tab.getAttribute("data-view") === view));
        });
        if (view === "map") {
          // 非表示の間にマウントされた地図は、表示状態でマウントし直す
          if (mapMountedHidden) { mapMountedHidden = false; render(); }
          restoreSelection();
        }
      }
      viewTabs.forEach(function (tab) {
        tab.addEventListener("click", function () { setMobileView(tab.getAttribute("data-view")); });
      });

      // OSのダークモード切り替えに地図のベーススタイルも追随させる
      if (darkMq.addEventListener) {
        darkMq.addEventListener("change", function () { render(); });
      }

      buildDayButtons();
      buildGenreChips();
      render();
      loadTodayStatus();
</script>
  </body>
</html>
